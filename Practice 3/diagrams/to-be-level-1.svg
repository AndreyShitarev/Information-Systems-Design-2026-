<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1200" viewBox="0 0 2400 1200"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#18232d" /></marker></defs><rect width="2400" height="1200" fill="white" /><g font-family="Arial, sans-serif" fill="#18232d" font-size="23"><text x="1200" y="48" text-anchor="middle" font-size="32">Обработать заявку и выполнить закупку</text><text x="1200" y="88" text-anchor="middle">Первый уровень IDEF0 · после внедрения системы (TO-BE)</text><!-- Управления --><g fill="none" stroke="#18232d" stroke-width="2.5"><path d="M80 190 H1950" /><path d="M350 190 V470" marker-end="url(#arrow)" /><path d="M750 190 V470" marker-end="url(#arrow)" /><path d="M1150 190 V470" marker-end="url(#arrow)" /><path d="M1550 190 V470" marker-end="url(#arrow)" /><path d="M1950 190 V470" marker-end="url(#arrow)" /><path d="M1240 300 V470" marker-end="url(#arrow)" /><path d="M1640 300 V470" marker-end="url(#arrow)" /></g><g fill="#18232d"><circle cx="350" cy="190" r="4" /><circle cx="750" cy="190" r="4" /><circle cx="1150" cy="190" r="4" /><circle cx="1550" cy="190" r="4" /></g><text x="80" y="165">Порядок согласования и права доступа</text><text x="1290" y="260" text-anchor="middle" font-size="21">Бюджет и лимиты расходов</text><path d="M1290 278 H1240 V300 M1290 278 H1640 V300" fill="none" stroke="#18232d" stroke-width="2.5" /><!-- Пять функций --><g fill="white" stroke="#18232d" stroke-width="3"><rect x="220" y="470" width="260" height="170" /><rect x="620" y="470" width="260" height="170" /><rect x="1020" y="470" width="260" height="170" /><rect x="1420" y="470" width="260" height="170" /><rect x="1820" y="470" width="260" height="170" /></g><g text-anchor="middle" font-size="25"><text x="350" y="520" font-size="23">Подать и</text><text x="350" y="554" font-size="23">зарегистрировать</text><text x="750" y="535">Согласовать</text><text x="750" y="572">заявку</text><text x="1150" y="535">Проверить</text><text x="1150" y="572">бюджет</text><text x="1550" y="535">Выполнить</text><text x="1550" y="572">закупку</text><text x="1950" y="535">Подтвердить</text><text x="1950" y="572">и закрыть заявку</text><text x="350" y="588" font-size="23" text-anchor="middle">заявку</text></g><g font-size="21" text-anchor="end"><text x="460" y="620">1</text><text x="860" y="620">2</text><text x="1260" y="620">3</text><text x="1660" y="620">4</text><text x="2060" y="620">5</text></g><!-- Основные входы и связи --><g fill="none" stroke="#18232d" stroke-width="2.5" marker-end="url(#arrow)"><path d="M35 555 H220" /><path d="M480 555 H620" /><path d="M880 555 H1020" /><path d="M1280 555 H1420" /><path d="M1680 555 H1820" /><path d="M1700 390 H1390 V510 H1420" /><path d="M2080 555 H2360" /><path d="M1680 610 H1750 V1040 H2360" /><!-- Возврат на уточнение --><path d="M880 500 H920 V350 H190 V510 H220" /><path d="M1280 500 H1320 V350 H920" marker-end="none" /><!-- Отказы --><path d="M880 610 H960 V780 H2360" /><path d="M1280 610 H1360 V780" marker-end="none" /></g><g fill="#18232d"><circle cx="920" cy="350" r="4" /><circle cx="1360" cy="780" r="4" /></g><g font-size="20" text-anchor="middle"><text x="120" y="498">Потребность</text><text x="120" y="528">в закупке</text><text x="550" y="520" font-size="18">Заявка в Pyrus</text><text x="950" y="581">Одобренная</text><text x="950" y="605">заявка</text><text x="1350" y="530" font-size="17">Допуск к закупке</text><text x="1750" y="491">Сведения</text><text x="1750" y="520">о закупке</text></g><text x="430" y="310" font-size="18">Возврат на уточнение или пересмотр</text><text x="1785" y="349" text-anchor="middle" font-size="19">Предложения и документы</text><text x="1785" y="378" text-anchor="middle" font-size="19">поставщика</text><text x="2120" y="494" font-size="21">Закрытая заявка</text><text x="2120" y="526" font-size="21">и документы</text><text x="1920" y="750" font-size="21">Отказ с указанием причины</text><text x="1930" y="1003" font-size="21">Закупленные товары или услуги</text><!-- Механизмы: ресурсы для каждого блока --><g fill="none" stroke="#18232d" stroke-width="2.5" marker-end="url(#arrow)"><path d="M350 875 V640" /><path d="M750 875 V640" /><path d="M1150 875 V640" /><path d="M1550 875 V640" /><path d="M1950 875 V640" /></g><g font-size="21" text-anchor="middle"><text x="350" y="918">Сотрудник</text><text x="350" y="951">Pyrus</text><text x="750" y="918">Руководитель</text><text x="750" y="951">Pyrus</text><text x="1150" y="918">Бухгалтер</text><text x="1150" y="951">Pyrus, Excel</text><text x="1550" y="918">Закупщик, бухгалтер,</text><text x="1550" y="951">поставщик</text><text x="1550" y="984" font-size="18">Pyrus, почта, Excel</text><text x="1950" y="918">Сотрудник, закупщик</text><text x="1950" y="951" font-size="18">Pyrus, почта, Excel</text></g><text x="40" y="1148" font-size="21">Узел: A0 · декомпозиция блока 0 диаграммы A-0</text><text x="2360" y="1148" text-anchor="end" font-size="21">Блоки A1–A5</text></g></svg>